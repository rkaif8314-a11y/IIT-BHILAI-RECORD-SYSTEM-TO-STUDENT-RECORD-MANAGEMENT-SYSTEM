name: ASRS CI

on:
  push:
    branches: [asrs-production]
  pull_request:
    branches: [asrs-production]

permissions:
  contents: read

concurrency:
  group: asrs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Check repository whitespace
        run: git diff --check
